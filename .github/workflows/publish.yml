name: Publish Catflap LPK

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Optional successful source build run ID
        type: string
        default: ''
      dry-run:
        description: Verify only; skip Release and store submission
        type: boolean
        default: true
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: catflap-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select a trusted successful build
        id: source
        uses: actions/github-script@v9
        env:
          SOURCE_REPOSITORY: ${{ secrets.LPK_SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ vars.LPK_SOURCE_BRANCH || 'main' }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        with:
          github-token: ${{ secrets.SOURCE_REPO_TOKEN }}
          script: |
            await require('./scripts/release.cjs').selectSource({github, core});
      - name: Download the generated package only
        if: steps.source.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.source.outputs.artifact-name }}
          path: dist/import
          repository: ${{ secrets.LPK_SOURCE_REPOSITORY }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ secrets.SOURCE_REPO_TOKEN }}
      - name: Inspect package boundaries and source checksum
        if: steps.source.outputs.available == 'true'
        id: package
        env:
          LPK_VERSION: ${{ steps.source.outputs.version }}
        run: python3 scripts/prepare-lpk.py
      - name: Verify package identity and architecture
        if: steps.source.outputs.available == 'true'
        uses: ca-x/lazycat-github-action@v1.3.6
        with:
          operation: publish-private
          config: .github/lazycat-action.yml
          version: ${{ steps.source.outputs.version }}
          changelog: Release ${{ steps.source.outputs.version }}
          lpk-path: ${{ steps.package.outputs.lpk-path }}
          download-url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.source.outputs.tag }}/${{ steps.source.outputs.package-id }}-v${{ steps.source.outputs.version }}.lpk
          sha256: ${{ steps.package.outputs.sha256 }}
          dry-run: true
      - name: Publish the versioned Release and verify remote bytes
        id: release
        if: ${{ steps.source.outputs.available == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        uses: actions/github-script@v9
        env:
          LPK_VERSION: ${{ steps.source.outputs.version }}
          LPK_PATH: ${{ steps.package.outputs.lpk-path }}
          LPK_SHA256: ${{ steps.package.outputs.sha256 }}
        with:
          script: |
            await require('./scripts/release.cjs').publishRelease({github, context, core});
      - name: Submit the same verified package to MiaoMiao
        id: store
        if: steps.release.outcome == 'success'
        uses: ca-x/lazycat-github-action@v1.3.6
        env:
          APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
        with:
          operation: publish-private
          config: .github/lazycat-action.yml
          version: ${{ steps.source.outputs.version }}
          changelog: ${{ steps.release.outputs.changelog }}
          lpk-path: ${{ steps.package.outputs.lpk-path }}
          download-url: ${{ steps.release.outputs.download-url }}
          sha256: ${{ steps.package.outputs.sha256 }}
